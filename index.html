<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6f42c1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Betonexa">
  <title>Betonexa</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--p:#6f42c1;--pd:#55309b;--bg:#f4f2f8;--card:#fff;--text:#25232a;--muted:#6d6875;--line:#e5e0ec;--danger:#b42318;--ok:#16794c}
    *{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
    button,input,select,textarea{font:inherit} button{cursor:pointer}
    .hidden{display:none!important}
    .login{position:fixed;inset:0;background:linear-gradient(145deg,#4e258c,#7d4bd0);display:grid;place-items:center;padding:18px;z-index:100}
    .login-card{width:min(430px,100%);background:#fff;border-radius:22px;padding:30px;box-shadow:0 24px 70px #26124780}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.brand img{width:64px;height:64px;border-radius:16px}.brand h1{margin:0;color:var(--p)}
    label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}
    input,select,textarea{width:100%;padding:11px;border:1px solid #cbc4d6;border-radius:9px;background:#fff}
    textarea{min-height:80px;resize:vertical}
    .btn{border:0;border-radius:9px;padding:11px 16px;font-weight:700}
    .btn-primary{background:var(--p);color:#fff}.btn-primary:hover{background:var(--pd)}
    .btn-light{background:#eee9f5;color:#3c3150}.btn-danger{background:#fee4e2;color:var(--danger)}
    .login .btn{width:100%;margin-top:16px}.error{color:var(--danger);min-height:20px;text-align:center;margin-top:9px;font-size:13px}
    .shell{min-height:100vh}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
    .top .brand{margin:0}.top .brand img{width:42px;height:42px}.top h1{font-size:22px}
    .content{max-width:1450px;margin:auto;padding:20px}
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
    .kpi,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 18px #3d245512}
    .kpi{padding:17px}.kpi small{color:var(--muted);font-weight:700}.kpi strong{display:block;font-size:27px;color:var(--p);margin-top:7px}
    .tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button.active{background:var(--p);color:#fff}
    .panel{padding:18px}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.status{min-height:22px;margin-top:12px;font-size:13px;color:var(--ok)}
    .table-wrap{overflow:auto;margin-top:16px;border:1px solid var(--line);border-radius:11px}
    table{border-collapse:collapse;width:100%;min-width:1200px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
    th{background:#f3eff8;color:#443754;position:sticky;top:0}tr:hover td{background:#fbf9fd}
    .row-actions{display:flex;gap:6px}
    .calendar-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
    .week{overflow:auto;border:1px solid var(--line);border-radius:11px}.grid{display:grid;grid-template-columns:70px repeat(7,minmax(145px,1fr));min-width:1085px}
    .head,.time,.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
    .head{background:var(--p);color:#fff;padding:10px;text-align:center;font-weight:700;position:sticky;top:0;z-index:2}
    .time{padding:24px 5px;text-align:center;background:#f7f5fa;font-weight:700}.cell{min-height:76px;padding:4px;background:#fff}
    .event{display:block;width:100%;border:0;border-left:4px solid var(--p);border-radius:7px;background:#efe8fa;padding:6px;text-align:left;font-size:12px;margin-bottom:4px}
    .loading{position:fixed;inset:0;background:#ffffffb8;display:grid;place-items:center;z-index:90;font-size:18px;font-weight:700;color:var(--p)}
    @media(max-width:950px){.kpis{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:650px){.content{padding:12px}.kpis,.form-grid{grid-template-columns:1fr}.top{padding:10px 12px}.top .brand span{display:none}.panel{padding:14px}}
  </style>
</head>
<body>
<div id="loading" class="loading hidden">Yükleniyor…</div>
<section id="login" class="login">
  <div class="login-card">
    <div class="brand"><img src="./icon-192.png" alt=""><div><h1>Betonexa</h1><small>Hazır Beton Sevkiyat Yönetimi</small></div></div>
    <label for="loginUser">Kullanıcı adı</label><input id="loginUser" autocomplete="username" value="ozlem">
    <label for="loginPass">Şifre</label><input id="loginPass" type="password" autocomplete="current-password">
    <button id="loginBtn" class="btn btn-primary">Giriş Yap</button>
    <div id="loginError" class="error"></div>
  </div>
</section>

<div id="app" class="shell hidden">
  <header class="top">
    <div class="brand"><img src="./icon-192.png" alt=""><h1>Betonexa</h1><span>Hazır Beton Sevkiyat Yönetimi</span></div>
    <button id="logoutBtn" class="btn btn-light">Çıkış</button>
  </header>
  <main class="content">
    <section class="kpis">
      <div class="kpi"><small>TOPLAM SEVKİYAT</small><strong id="kpiCount">0</strong></div>
      <div class="kpi"><small>BUGÜNKÜ m³</small><strong id="kpiToday">0,00</strong></div>
      <div class="kpi"><small>AYLIK m³</small><strong id="kpiMonth">0,00</strong></div>
      <div class="kpi"><small>POMPALI m³</small><strong id="kpiPump">0,00</strong></div>
    </section>
    <nav class="tabs">
      <button class="btn btn-light active" data-page="records">Sevkiyatlar</button>
      <button class="btn btn-light" data-page="calendar">Haftalık Takvim</button>
    </nav>

    <section id="recordsPage" class="panel">
      <form id="shipmentForm">
        <input id="editId" type="hidden">
        <div class="form-grid">
          <div><label>Tarih</label><input id="tarih" type="date" required></div>
          <div><label>Saat</label><input id="saat" type="time" required></div>
          <div><label>Santral</label><select id="santral" required>
            <option value="">Seçiniz</option><option>Işıkkent</option><option>Torbalı</option><option>Gaziemir</option><option>Özbek</option><option>Çeşme</option><option>Çiğli</option><option>Koyundere</option><option>Aliağa</option><option>Zeytindağ</option><option>Akhisar</option><option>Aydın</option><option>Tekirdağ</option><option>Kıraç</option><option>Çorlu</option>
          </select></div>
          <div><label>Firma</label><input id="firma"></div>
          <div><label>Şantiye</label><input id="santiye"></div>
          <div><label>Beton sınıfı</label><select id="betonSinifi" required><option value="">Seçiniz</option><option>C 10</option><option>C 12</option><option>C 16</option><option>C 20</option><option>C 25</option><option>C 30</option><option>C 35</option><option>C 40</option><option>C 45</option><option>C 50</option></select></div>
          <div><label>Beton özelliği</label><select id="betonOzelligi"><option>Normal</option><option>S3</option><option>S4</option><option>Katkısız</option><option>Brüt</option><option>Su Geçirimsiz</option></select></div>
          <div><label>Metraj (m³)</label><input id="metraj" type="number" min="0" step="0.01" required></div>
          <div><label>Pompa durumu</label><select id="pompaVar"><option value="false">Pompasız</option><option value="true">Pompalı</option></select></div>
          <div id="pumpTypeWrap" class="hidden"><label>Pompa tipi</label><select id="pompaTipi"><option value="">Seçiniz</option><option>38'lik</option><option>42'lik</option><option>47'lik</option><option>52'lik</option><option>56'lık</option></select></div>
          <div><label>Sorumlu kişi</label><input id="sorumluKisi"></div>
          <div><label>Telefon</label><input id="telefon" placeholder="0553 618 18 53"></div>
          <div style="grid-column:1/-1"><label>Notlar</label><textarea id="notlar"></textarea></div>
        </div>
        <div class="actions">
          <button class="btn btn-primary" type="submit" id="saveBtn">Sevkiyatı Kaydet</button>
          <button class="btn btn-light hidden" type="button" id="cancelEdit">Düzenlemeyi İptal Et</button>
          <button class="btn btn-light" type="button" id="refreshBtn">Yenile</button>
        </div>
        <div id="status" class="status"></div>
      </form>

      <div class="table-wrap"><table>
        <thead><tr><th>Tarih</th><th>Saat</th><th>Santral</th><th>Firma</th><th>Şantiye</th><th>Beton</th><th>Metraj</th><th>Pompa</th><th>Sorumlu</th><th>Telefon</th><th>Not</th><th>İşlem</th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
    </section>

    <section id="calendarPage" class="panel hidden">
      <div class="calendar-toolbar"><div><button id="prevWeek" class="btn btn-light">◀ Önceki</button> <button id="thisWeek" class="btn btn-light">Bu Hafta</button> <button id="nextWeek" class="btn btn-light">Sonraki ▶</button></div><strong id="weekTitle"></strong></div>
      <div class="week"><div id="weekGrid" class="grid"></div></div>
    </section>
  </main>
</div>

<script>
"use strict";
const SUPABASE_URL="https://wryxelgeycagmljvtmnr.supabase.co";
const SUPABASE_KEY="sb_publishable_c2KnSZnHRnSGGq6R9AzU9g_rUfxtOog";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const TABLE="sevkiyatlar";
const LOGIN_USER="ozlem";
const LOGIN_PASS="Beton2026!";
let records=[];
let weekStart=monday(new Date());

const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
function setLoading(v){$("loading").classList.toggle("hidden",!v)}
function setStatus(t,err=false){$("status").textContent=t;$("status").style.color=err?"var(--danger)":"var(--ok)"}
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function monday(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function trDate(s){return s?s.split("-").reverse().join("."):""}
function m3(n){return Number(n||0).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2})}
function phoneFormat(v){const d=String(v||"").replace(/\D/g,"").slice(0,11);return [d.slice(0,4),d.slice(4,7),d.slice(7,9),d.slice(9,11)].filter(Boolean).join(" ")}

async function loadRecords(){
  setLoading(true);setStatus("");
  const {data,error}=await db.from(TABLE).select("*").order("tarih",{ascending:true}).order("saat",{ascending:true});
  setLoading(false);
  if(error){setStatus("Veriler alınamadı: "+error.message,true);return}
  records=data||[];renderTable();renderKpis();renderCalendar();
}

function payload(){
  return {
    tarih:$("tarih").value,
    saat:$("saat").value,
    santral:$("santral").value,
    firma:$("firma").value.trim(),
    santiye:$("santiye").value.trim(),
    beton_sinifi:$("betonSinifi").value,
    beton_ozelligi:$("betonOzelligi").value,
    metraj:Number($("metraj").value),
    pompa_var_mi:$("pompaVar").value==="true",
    pompa_tipi:$("pompaVar").value==="true"?$("pompaTipi").value:null,
    sorumlu_kisi:$("sorumluKisi").value.trim(),
    telefon:phoneFormat($("telefon").value),
    notlar:$("notlar").value.trim()
  };
}
function clearForm(){
  $("shipmentForm").reset();$("editId").value="";$("cancelEdit").classList.add("hidden");$("saveBtn").textContent="Sevkiyatı Kaydet";$("pumpTypeWrap").classList.add("hidden");$("tarih").value=iso(new Date())
}
async function saveShipment(e){
  e.preventDefault();const p=payload();
  if(!p.tarih||!p.saat||!p.santral||!p.beton_sinifi||!Number.isFinite(p.metraj)){setStatus("Zorunlu alanları doldurun.",true);return}
  if(p.pompa_var_mi&&!p.pompa_tipi){setStatus("Pompa tipini seçin.",true);return}
  setLoading(true);const id=$("editId").value;
  const q=id?db.from(TABLE).update(p).eq("id",id):db.from(TABLE).insert(p);
  const {error}=await q;setLoading(false);
  if(error){setStatus("Kayıt işlemi başarısız: "+error.message,true);return}
  setStatus(id?"Sevkiyat güncellendi.":"Sevkiyat kaydedildi.");clearForm();await loadRecords();
}
function editRecord(id){
  const r=records.find(x=>String(x.id)===String(id));if(!r)return;
  $("editId").value=r.id;$("tarih").value=r.tarih||"";$("saat").value=(r.saat||"").slice(0,5);$("santral").value=r.santral||"";$("firma").value=r.firma||"";$("santiye").value=r.santiye||"";$("betonSinifi").value=r.beton_sinifi||"";$("betonOzelligi").value=r.beton_ozelligi||"Normal";$("metraj").value=r.metraj??"";$("pompaVar").value=String(!!r.pompa_var_mi);$("pumpTypeWrap").classList.toggle("hidden",!r.pompa_var_mi);$("pompaTipi").value=r.pompa_tipi||"";$("sorumluKisi").value=r.sorumlu_kisi||"";$("telefon").value=r.telefon||"";$("notlar").value=r.notlar||"";
  $("saveBtn").textContent="Değişiklikleri Kaydet";$("cancelEdit").classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"})
}
async function deleteRecord(id){
  if(!confirm("Bu sevkiyat silinsin mi?"))return;
  setLoading(true);const {error}=await db.from(TABLE).delete().eq("id",id);setLoading(false);
  if(error){setStatus("Silinemedi: "+error.message,true);return}
  setStatus("Sevkiyat silindi.");await loadRecords();
}
function renderTable(){
  $("rows").innerHTML=records.map(r=>`<tr>
    <td>${esc(trDate(r.tarih))}</td><td>${esc((r.saat||"").slice(0,5))}</td><td>${esc(r.santral)}</td><td>${esc(r.firma)}</td><td>${esc(r.santiye)}</td>
    <td>${esc([r.beton_sinifi,r.beton_ozelligi].filter(Boolean).join(" "))}</td><td>${m3(r.metraj)} m³</td>
    <td>${r.pompa_var_mi?esc(r.pompa_tipi||"Pompalı"):"Pompasız"}</td><td>${esc(r.sorumlu_kisi)}</td><td>${esc(r.telefon)}</td><td>${esc(r.notlar)}</td>
    <td><div class="row-actions"><button class="btn btn-light" onclick="editRecord(${Number(r.id)})">Düzenle</button><button class="btn btn-danger" onclick="deleteRecord(${Number(r.id)})">Sil</button></div></td>
  </tr>`).join("");
}
function renderKpis(){
  const now=new Date(),today=iso(now),month=today.slice(0,7);
  $("kpiCount").textContent=records.length;
  $("kpiToday").textContent=m3(records.filter(r=>r.tarih===today).reduce((s,r)=>s+Number(r.metraj||0),0))+" m³";
  $("kpiMonth").textContent=m3(records.filter(r=>(r.tarih||"").startsWith(month)).reduce((s,r)=>s+Number(r.metraj||0),0))+" m³";
  $("kpiPump").textContent=m3(records.filter(r=>r.pompa_var_mi).reduce((s,r)=>s+Number(r.metraj||0),0))+" m³";
}
function renderCalendar(){
  const days=["Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi","Pazar"],grid=$("weekGrid");grid.innerHTML="";
  const end=addDays(weekStart,6);$("weekTitle").textContent=`${trDate(iso(weekStart))} – ${trDate(iso(end))}`;
  grid.insertAdjacentHTML("beforeend",'<div class="head">Saat</div>');
  for(let i=0;i<7;i++){const d=addDays(weekStart,i);grid.insertAdjacentHTML("beforeend",`<div class="head">${days[i]}<br>${trDate(iso(d)).slice(0,5)}</div>`)}
  for(let h=6;h<=22;h++){
    grid.insertAdjacentHTML("beforeend",`<div class="time">${String(h).padStart(2,"0")}:00</div>`);
    for(let i=0;i<7;i++){
      const date=iso(addDays(weekStart,i));
      const items=records.filter(r=>r.tarih===date&&Number((r.saat||"00").slice(0,2))===h);
      grid.insertAdjacentHTML("beforeend",`<div class="cell">${items.map(r=>`<button class="event" onclick="editRecord(${Number(r.id)});showPage('records')"><b>${esc((r.saat||"").slice(0,5))}</b> ${esc(r.firma||"Firma")}<br>${esc(r.santiye||"")} • ${m3(r.metraj)} m³<br>${r.pompa_var_mi?esc(r.pompa_tipi):"Pompasız"}</button>`).join("")}</div>`)
    }
  }
}
function showPage(p){
  $("recordsPage").classList.toggle("hidden",p!=="records");$("calendarPage").classList.toggle("hidden",p!=="calendar");
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.page===p))
}
function login(){
  if($("loginUser").value.trim()===LOGIN_USER&&$("loginPass").value===LOGIN_PASS){sessionStorage.setItem("betonexa_login","1");$("login").classList.add("hidden");$("app").classList.remove("hidden");loadRecords()}
  else $("loginError").textContent="Kullanıcı adı veya şifre hatalı."
}
$("loginBtn").addEventListener("click",login);$("loginPass").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
$("logoutBtn").addEventListener("click",()=>{sessionStorage.removeItem("betonexa_login");location.reload()});
$("shipmentForm").addEventListener("submit",saveShipment);$("cancelEdit").addEventListener("click",clearForm);$("refreshBtn").addEventListener("click",loadRecords);
$("pompaVar").addEventListener("change",()=>$("pumpTypeWrap").classList.toggle("hidden",$("pompaVar").value!=="true"));
$("telefon").addEventListener("input",e=>e.target.value=phoneFormat(e.target.value));
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>showPage(b.dataset.page)));
$("prevWeek").addEventListener("click",()=>{weekStart=addDays(weekStart,-7);renderCalendar()});$("nextWeek").addEventListener("click",()=>{weekStart=addDays(weekStart,7);renderCalendar()});$("thisWeek").addEventListener("click",()=>{weekStart=monday(new Date());renderCalendar()});
window.editRecord=editRecord;window.deleteRecord=deleteRecord;window.showPage=showPage;
$("tarih").value=iso(new Date());
if(sessionStorage.getItem("betonexa_login")==="1"){$("login").classList.add("hidden");$("app").classList.remove("hidden");loadRecords()}
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(console.error));
</script>
</body>
</html>
