name: Append tracking finalizer at EOF
on:
  push:
    paths:
      - '.github/workflows/append-tracking-finalizer.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append finalizer after all existing inline patches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\s*<script\s+src=["\']\./tracking-finalizer\.js(?:\?v=[^"\']+)?["\']\s*>\s*</script>\s*','\n',s)
          s=s.rstrip()+"\n<script src=\"./tracking-finalizer.js?v=20260820-eof1\"></script>\n"
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Load tracking finalizer after all page patches'
          git push
