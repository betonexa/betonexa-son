name: One-time menu layout install
on:
  push:
    paths:
      - 'menu-layout.js'
      - '.github/workflows/install-menu-layout-once.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add menu layout script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./menu-layout.js?v=20260819-1"></script>'
          if tag not in s:
              pos=s.rfind('</body>')
              if pos < 0:
                  raise SystemExit('body closing tag not found')
              s=s[:pos]+tag+'\n'+s[pos:]
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'feat: load reorganized navigation'
          git push
