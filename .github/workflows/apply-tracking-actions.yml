name: Apply stable tracking actions
on:
  push:
    paths:
      - 'deploy-trigger.txt'
      - '.github/workflows/apply-tracking-actions.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load stable tracking actions once
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('menu-layout.js')
          s=p.read_text(encoding='utf-8')
          marker='/* BETONEXA_STABLE_TRACKING_ACTIONS_LOADER */'
          if marker in s:
              s=s.split(marker)[0].rstrip()+"\n"
          s += '''\n/* BETONEXA_STABLE_TRACKING_ACTIONS_LOADER */\n(function(){\n  if(document.querySelector('script[data-betonexa-tracking-actions]'))return;\n  const s=document.createElement('script');\n  s.dataset.betonexaTrackingActions='1';\n  s.src='./tracking-actions.js?v=20260820-stable1';\n  document.head.appendChild(s);\n})();\n'''
          p.write_text(s,encoding='utf-8')

          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8')
          h,n=re.subn(r'(<script\s+src=["\']\./menu-layout\.js)(?:\?v=[^"\']+)?(["\']\s*>\s*</script>)',r'\1?v=20260820-stable1\2',h,count=1)
          if n!=1:
              raise SystemExit('menu-layout script tag not found exactly once')
          idx.write_text(h,encoding='utf-8')
          PY
      - name: Commit stable layout loader
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add menu-layout.js index.html
          git diff --cached --quiet || git commit -m 'Load stable tracking actions without duplicate layout patches'
          git push
