name: Clean tracking layout fix
on:
  push:
    paths:
      - '.github/workflows/fix-tracking-layout-clean.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace tracking export placement only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('menu-layout.js')
          s=p.read_text(encoding='utf-8')

          new_style=r'''  function styleTrackingExportActions(){
    const report=document.querySelector('#recordsPage .records-report');
    const pdf=document.getElementById('pdfBtn');
    const excel=document.getElementById('excelBtn');
    const print=document.getElementById('printBtn');
    if(!report||!pdf||!excel||!print)return;

    let host=report.querySelector('.tracking-export-slot');

    if(!host){
      const nodes=[...report.querySelectorAll('*')];
      const textOf=el=>(el.textContent||'').replace(/\s+/g,' ').trim();
      const betonLeaf=nodes
        .filter(el=>/\b\d+\s*beton\b/i.test(textOf(el)))
        .filter(el=>![...el.children].some(c=>/\b\d+\s*beton\b/i.test(textOf(c))))
        .sort((a,b)=>textOf(a).length-textOf(b).length)[0];
      const cimentoLeaf=nodes
        .filter(el=>/\b\d+\s*çimento\b/i.test(textOf(el)))
        .filter(el=>![...el.children].some(c=>/\b\d+\s*çimento\b/i.test(textOf(c))))
        .sort((a,b)=>textOf(a).length-textOf(b).length)[0];

      if(!betonLeaf||!cimentoLeaf)return;

      const climbBadge=(leaf,other)=>{
        let cur=leaf;
        while(cur.parentElement&&cur.parentElement!==report){
          const p=cur.parentElement;
          const t=textOf(p);
          if(p.contains(other)||/Sevkiyat Filtreleri/i.test(t)||/Bugün.*Yarın.*Bu Hafta/i.test(t))break;
          cur=p;
        }
        return cur;
      };

      const betonBadge=climbBadge(betonLeaf,cimentoLeaf);
      const cimentoBadge=climbBadge(cimentoLeaf,betonLeaf);
      const parent=betonBadge.parentElement;

      host=document.createElement('div');
      host.className='tomorrow-actions tracking-export-slot';
      if(parent) parent.insertBefore(host,betonBadge);
      else report.insertBefore(host,report.firstChild);

      if(betonBadge.isConnected)betonBadge.remove();
      if(cimentoBadge.isConnected)cimentoBadge.remove();
    }

    const oldParent=pdf.parentElement;
    [pdf,excel,print].forEach(btn=>{
      if(btn.parentElement!==host)host.appendChild(btn);
    });

    if(oldParent&&oldParent!==host&&!oldParent.querySelector('button')){
      oldParent.style.setProperty('display','none','important');
    }

    host.className='tomorrow-actions tracking-export-slot';
    host.style.setProperty('display','flex','important');
    host.style.setProperty('align-items','center','important');
    host.style.setProperty('justify-content','flex-end','important');
    host.style.setProperty('gap','8px','important');
    host.style.setProperty('flex-wrap','nowrap','important');
    host.style.setProperty('width','auto','important');
    host.style.setProperty('margin','0','important');
    host.style.setProperty('padding','0','important');
    host.style.setProperty('position','static','important');
    host.style.setProperty('background','transparent','important');
    host.style.setProperty('border','0','important');

    report.style.removeProperty('padding-top');
    report.style.removeProperty('position');

    pdf.className='btn btn-primary';
    excel.className='btn btn-light';
    print.className='btn btn-light';
    pdf.style.setProperty('background','#6f42c1','important');
    pdf.style.setProperty('border-color','#6f42c1','important');
    pdf.style.setProperty('color','#fff','important');
    [excel,print].forEach(btn=>{
      btn.style.removeProperty('background');
      btn.style.removeProperty('border-color');
      btn.style.removeProperty('color');
    });
    [pdf,excel,print].forEach(btn=>{
      btn.style.setProperty('width','auto','important');
      btn.style.setProperty('min-width','0','important');
      btn.style.setProperty('margin','0','important');
      btn.style.setProperty('white-space','nowrap','important');
    });
  }

'''

          s,n=re.subn(r'  function styleTrackingExportActions\(\)\{.*?\n  \}\n\n(?=  async function restoreConcreteContactColumns)',new_style,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('styleTrackingExportActions replacement failed')

          p.write_text(s,encoding='utf-8')

          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8')
          h,n=re.subn(r'(<script\s+src=["\']\./menu-layout\.js)(?:\?v=[^"\']+)?(["\']\s*>\s*</script>)',r'\1?v=20260820-summary-slot\2',h,count=1)
          if n!=1:
              raise SystemExit('menu-layout script tag not found exactly once')
          idx.write_text(h,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add menu-layout.js index.html
          git diff --cached --quiet || git commit -m 'Place tracking exports in summary slot'
          git push
