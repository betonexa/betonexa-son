name: Remove duplicate menu layout loader
on:
  push:
    paths:
      - '.github/workflows/remove-duplicate-menu-layout.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep one menu-layout script only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pattern=r'(?:\s*<script\s+src=["\']\./menu-layout\.js(?:\?v=[^"\']+)?["\']\s*>\s*</script>\s*)+'
          replacement='\n<script src="./menu-layout.js?v=20260820-single-final"></script>\n'
          s,n=re.subn(pattern,replacement,s,count=1)
          if n!=1:
              raise SystemExit('menu-layout script group not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Remove duplicate menu-layout script loader'
          git push
# trigger
