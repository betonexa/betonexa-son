name: One-time fresh login fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-login-once.yml'

permissions:
  contents: write

jobs:
  fix-login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force fresh password screen on app open
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          start_marker = '(async function requireFreshLogin(){'
          end_marker = '\n})();\nif("serviceWorker" in navigator)'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('requireFreshLogin block not found; no changes made')

          replacement = '''(async function requireFreshLogin(){
            const client = ensureDb();

            sessionStorage.removeItem("betonexa_login");
            $("login").classList.remove("hidden");
            $("app").classList.add("hidden");

            if($("loginPass")) $("loginPass").value = "";

            try{
              if(client){
                await client.auth.signOut({ scope: "local" });
              }
            }catch(e){
              console.warn("Eski yerel oturum temizlenemedi:", e);
            }

            setTimeout(() => $("loginPass")?.focus(), 50);
          })();'''

          text = text[:start] + replacement + text[end + len('\n})();'):]
          p.write_text(text, encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: always require password on app open"
          git push