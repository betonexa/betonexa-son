name: One-time cement cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-cement-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate loader from index
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          text=text.replace('<script src="./cement-module.js?v=20260819-1"></script>\n','')
          p.write_text(text,encoding='utf-8')
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "chore: remove duplicate cement loader"
          git push
