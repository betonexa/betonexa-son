name: One-time cement module install

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-cement-once.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add cement module script
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="./cement-module.js?v=20260819-1"></script>'
          if tag not in text:
              if '</body>' not in text:
                  raise SystemExit('body marker not found')
              text = text.replace('</body>', tag + '\n</body>', 1)
              p.write_text(text, encoding='utf-8')
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: enable cement shipment module"
          git push
